name: Otrion release packages
on:
  workflow_dispatch:
  push:
    branches: [feat/release-0.1.0]
    tags: ['v[0-9]*']

concurrency:
  group: otrion-packages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel, windows-2022, windows-11-arm, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    env:
      PNPM_CONFIG_FROZEN_LOCKFILE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libkrb5-dev libxkbfile-dev libsecret-1-dev libx11-dev libxfixes-dev libxkbcommon-dev libudev-dev libgtk-3-dev
      - name: Install project dependencies
        shell: bash
        run: |
          npm install --global "$(node -p "require('./package.json').packageManager")"
          pnpm install --frozen-lockfile
      - name: Package for the native target
        shell: bash
        run: bash scripts/otrion/package-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Otrion-${{ runner.os }}-${{ runner.arch }}
          path: dist/v*/*
          if-no-files-found: error
          compression-level: 0
