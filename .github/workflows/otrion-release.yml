name: Otrion release packages
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the version in product.json (main only)
        type: boolean
        default: false
  push:
    branches: [main]
    paths: [product.json]
    tags: ['v[0-9]*']

concurrency:
  group: otrion-packages-${{ github.ref }}-${{ github.sha }}-${{ github.event_name }}-${{ inputs.publish }}

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.release.outputs.build }}
      publish: ${{ steps.release.outputs.publish }}
      tag: ${{ steps.release.outputs.tag }}
      matrix: ${{ steps.release.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select the release
        id: release
        env:
          BEFORE: ${{ github.event.before }}
          PUBLISH_REQUESTED: ${{ inputs.publish }}
        run: bash scripts/otrion/select-release.sh

  package:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      PNPM_CONFIG_FROZEN_LOCKFILE: 'true'
      VSCODE_BUNDLE_SEQUENTIAL: '1'
      GOMEMLIMIT: 2GiB
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libkrb5-dev libxkbfile-dev libsecret-1-dev libx11-dev libxfixes-dev libxkbcommon-dev libudev-dev libgtk-3-dev
      - name: Cache the pinned ripgrep release for pnpm postinstall
        shell: bash
        run: |
          case "$RUNNER_OS/$RUNNER_ARCH" in
            macOS/ARM64) target=aarch64-apple-darwin.tar.gz; sha=2fa16464fd8638588a67c7fc172d3c4b57fbdc65dff366e10b0b0e90734628a6 ;;
            macOS/X64) target=x86_64-apple-darwin.tar.gz; sha=591c693e80bb444ef1907b2a906feb9c77bcafe1cdf509107cc75dcf0e875bd2 ;;
            Windows/ARM64) target=aarch64-pc-windows-msvc.zip; sha=cc36bae403f25c838d25a3c65ba64f38cc00904652e89d6377b5ceaf66df8432 ;;
            Windows/X64) target=x86_64-pc-windows-msvc.zip; sha=bd28761f4918ea8fcb7a95f636b4422a915d55af268d9805be82d8ce0fdfc823 ;;
            Linux/ARM64) target=aarch64-unknown-linux-musl.tar.gz; sha=dd3738a4b6e8df0fb3bc3edc5af352c4c39e0d97ad118a23e5176bdc5d48ba08 ;;
            Linux/X64) target=x86_64-unknown-linux-musl.tar.gz; sha=4499958bfd5252df3d9e7504127fd448e4a14fbf2805ef4f14baaa1bcf775188 ;;
            *) exit 1 ;;
          esac
          cache="$(node -p "require('os').tmpdir().split(require('path').sep).join('/')")/vscode-ripgrep-cache-1.17.1"
          mkdir -p "$cache"
          cd "$cache"
          asset="ripgrep-v15.0.1-$target"
          curl --fail --location --retry 3 -o "$asset" "https://github.com/microsoft/ripgrep-prebuilt/releases/download/v15.0.1/$asset"
          node -e 'const [file, sha] = process.argv.slice(1); require("assert").strictEqual(require("crypto").createHash("sha256").update(require("fs").readFileSync(file)).digest("hex"), sha)' "$asset" "$sha"
      - name: Install project dependencies
        shell: bash
        run: |
          npm install --global "$(node -p "require('./package.json').packageManager")"
          pnpm install --frozen-lockfile
      - name: Locate Windows SDK tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/bin'
          $tools = Get-ChildItem -Path "$root/*/x64/signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $tools) { throw 'Windows SDK signtool.exe was not found' }
          $tools.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Exercise the Linux archive update and relaunch path
        if: runner.os == 'Linux'
        run: |
          pnpm --dir build exec esbuild ../scripts/otrion/linux-update.test.mts --bundle --platform=node --format=esm --outfile="$RUNNER_TEMP/linux-update.test.mjs"
          node --test "$RUNNER_TEMP/linux-update.test.mjs"
      - name: Package for the native target
        shell: bash
        run: bash scripts/otrion/package-release.sh
      - name: Sign and notarize the macOS update package
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          REQUIRE_MACOS_NOTARIZATION: ${{ needs.prepare.outputs.publish }}
        run: bash scripts/otrion/sign-macos-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Otrion-${{ runner.os }}-${{ runner.arch }}
          path: dist/${{ needs.prepare.outputs.tag }}/
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: [prepare, package]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    concurrency:
      group: otrion-publish-${{ needs.prepare.outputs.tag }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: Otrion-*
          path: release-assets
          merge-multiple: true
      - name: Tag and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          find release-assets -type f -print | sort
          bash scripts/otrion/publish-release.sh release-assets
